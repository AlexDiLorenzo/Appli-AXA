<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AXA → Excel Virement | Montpellier Dépannage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark:  #1e4d1a;
      --green:       #2a6b24;
      --green-light: #e8f5e3;
      --yellow:      #e8b800;
      --yellow-soft: #fdf6d8;
      --text:        #1a1a1a;
      --text-muted:  #5c6b5a;
      --border:      #c8d9c5;
      --surface:     #ffffff;
      --bg:          #f2f5f1;
      --radius:      14px;
      --axa-blue:    #00008f;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 20px 48px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo-wrap {
      display: inline-block;
      background: var(--green-dark);
      border-radius: 50%;
      padding: 6px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(30,77,26,.30);
    }

    .logo-wrap img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: block;
      object-fit: cover;
    }

    .company {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 6px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--green-dark);
      margin-bottom: 6px;
    }

    h1 span { color: var(--yellow); -webkit-text-stroke: 0.5px #b08800; }

    .tagline {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 32px;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 32px rgba(30,77,26,.08);
      border: 1px solid rgba(30,77,26,.08);
    }

    /* ── Textarea ── */
    .field-label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
      display: block;
    }

    #email-input {
      width: 100%;
      height: 220px;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      resize: vertical;
      transition: border-color .15s;
      outline: none;
    }

    #email-input:focus { border-color: var(--green); }
    #email-input::placeholder { color: #9cac98; }

    /* ── Preview ── */
    .preview {
      margin-top: 16px;
      background: var(--green-light);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      display: none;
    }

    .preview.show { display: block; }

    .preview-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--green);
      margin-bottom: 12px;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }

    .preview-field label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .preview-field span {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--green-dark);
    }

    /* ── Site breakdown ── */
    .site-breakdown {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .site-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--green-dark);
    }

    .site-chip .count {
      background: var(--green-dark);
      color: #fff;
      border-radius: 999px;
      font-size: 0.7rem;
      padding: 1px 7px;
    }

    .site-chip.autres { color: #b08800; }
    .site-chip.autres .count { background: var(--yellow); color: #4a3a00; }

    /* ── Button ── */
    #gen-btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: var(--green-dark);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, transform .1s, opacity .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #gen-btn:hover:not(:disabled) { background: var(--green); }
    #gen-btn:active:not(:disabled) { transform: scale(0.99); }
    #gen-btn:disabled { opacity: .45; cursor: not-allowed; }

    #gen-btn svg { width: 18px; height: 18px; }

    /* ── Status ── */
    #status {
      margin-top: 14px;
      border-radius: 10px;
      padding: 12px 15px;
      font-size: 0.875rem;
      display: none;
      align-items: center;
      gap: 10px;
    }

    #status.show { display: flex; }
    #status.success { background: #e8f5e3; color: #15803d; }
    #status.error   { background: #fef2f2; color: #b91c1c; }

    #status svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* ── Footer ── */
    footer {
      margin-top: 20px;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-wrap">
      <img src="logo.jpg" alt="Montpellier Dépannage" />
    </div>
    <p class="company">Montpellier Dépannage</p>
    <h1>AXA <span>→ Excel Virement</span></h1>
    <p class="tagline">Collez le contenu du mail AXA, générez un fichier Excel par site en un clic</p>
  </div>

  <div class="card">
    <label class="field-label" for="email-input">Contenu du mail AXA</label>
    <textarea id="email-input" placeholder="Collez ici le texte complet du mail de règlement AXA…"></textarea>

    <div class="preview" id="preview">
      <p class="preview-title">Données détectées</p>
      <div class="preview-grid">
        <div class="preview-field"><label>Règlement n°</label><span id="f-ref">—</span></div>
        <div class="preview-field"><label>Date de paiement</label><span id="f-date">—</span></div>
        <div class="preview-field"><label>Montant total</label><span id="f-total">—</span></div>
        <div class="preview-field"><label>Nb de factures</label><span id="f-count">—</span></div>
      </div>
      <div class="site-breakdown" id="site-breakdown"></div>
    </div>

    <button id="gen-btn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 10v6m0 0-3-3m3 3 3-3M3 15v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/>
        <path d="M7 4h10l3 6H4L7 4Z"/>
      </svg>
      Générer le(s) fichier(s) Excel
    </button>

    <div id="status"></div>
  </div>

  <footer>Traitement 100 % local — aucune donnée envoyée sur internet</footer>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// PARSER
// ─────────────────────────────────────────────────────────────────────────────

function parseAXAEmail(raw) {
  const lines    = raw.split('\n').map(l => l.trim());
  const nonEmpty = lines.filter(l => l !== '');

  const find = (re) => {
    for (const l of nonEmpty) {
      const m = l.match(re);
      if (m) return m[1].trim();
    }
    return '';
  };

  const totalAmount = find(/Montant Total[^:]*:\s*(.+)/i);
  const paymentDate = find(/Date de paiement[^:]*:\s*(.+)/i);
  const paymentRef  = find(/Reference de paiement[^:]*:\s*(.+)/i);
  const bankAccount = find(/Votre compte bancaire[^:]*:\s*(.+)/i);
  const payCycle    = find(/Cycle de paiement[^:]*:\s*(.+)/i);

  // Invoice data starts after the last column-header line
  const headerEndIdx = nonEmpty.findLastIndex(l => /Montant de la facture/i.test(l));
  const dataLines = headerEndIdx >= 0 ? nonEmpty.slice(headerEndIdx + 1) : [];

  const invoices = [];
  let i = 0;
  while (i < dataLines.length) {
    const date = dataLines[i];
    if (!/^\d{2}\/\d{2}\/\d{4}$/.test(date)) { i++; continue; }

    const dossier   = (dataLines[i + 1] || '').trim();
    const votreFact = (dataLines[i + 2] || '').trim();
    const notreFact = (dataLines[i + 3] || '').trim();
    const currency  = (dataLines[i + 4] || '').trim();
    const montant   = (dataLines[i + 5] || '').trim();

    if (currency === 'EUR') {
      invoices.push({ date, dossier, votreFact, notreFact, montant });
      i += 6;
    } else {
      i++;
    }
  }

  return { totalAmount, paymentDate, paymentRef, bankAccount, payCycle, invoices };
}

// ─────────────────────────────────────────────────────────────────────────────
// SITES
// ─────────────────────────────────────────────────────────────────────────────
// Le numéro de facture indique la société / l'agence :
//   F + lettre → agence de Montpellier Dépannage
//     FM Montpellier · FV Villetelle · FC Clermont-l'Hérault · FP Pérols · FJ Agence A9 · FR Remoulins
//   F + chiffres → Étoile Assistances  ou  Lunel Dépannage
//     Lunel  = F{AAMM}{CHRONO} : commence par l'année (2 chiffres) + le mois d'émission
//     Étoile = F{CHRONO}       : numéro purement séquentiel
//   Comme on ne connaît pas la longueur des CHRONO, on distingue Lunel d'Étoile
//   en comparant les 4 premiers chiffres à la date d'émission de la facture
//   (colonne « date » du tableau AXA) : si ça correspond → Lunel, sinon → Étoile.

const SITE_LABELS = {
  FM: 'Montpellier',
  FV: 'Villetelle',
  FC: "Clermont-l'Herault",
  FP: 'Perols',
  FJ: 'Agence A9',
  FR: 'Remoulins',
  FETOILE: 'Etoile Assistances',
  FLUNEL: 'Lunel Depannage',
  AUTRES: 'Autres',
};

function siteCodeOf(inv) {
  const num = String(inv.votreFact || '').trim().toUpperCase();

  // Agences Montpellier Dépannage : F suivi d'une lettre.
  const letterMatch = num.match(/^(F[MVCPJR])/);
  if (letterMatch) return letterMatch[1];

  // F suivi uniquement de chiffres : Étoile Assistances ou Lunel Dépannage.
  if (/^F\d+$/.test(num)) {
    const digits = num.slice(1);
    const d = String(inv.date || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    // Lunel : les 4 premiers chiffres = AAMM (année sur 2 chiffres + mois) de la
    // date d'émission de la facture, suivis d'au moins un chiffre de chrono.
    if (d && digits.length >= 5 && digits.slice(0, 4) === d[3].slice(2) + d[2]) {
      return 'FLUNEL';
    }
    return 'FETOILE';
  }

  return 'AUTRES';
}

// Regroupe les factures par société/agence, en conservant l'ordre d'apparition.
function groupBySite(invoices) {
  const groups = new Map();
  for (const inv of invoices) {
    const code = siteCodeOf(inv);
    if (!groups.has(code)) groups.set(code, []);
    groups.get(code).push(inv);
  }
  return groups;
}

// ─────────────────────────────────────────────────────────────────────────────
// EXCEL (.xlsx) GENERATOR
// ─────────────────────────────────────────────────────────────────────────────
// Génère un vrai fichier .xlsx (OOXML) — aucune librairie externe, 100 % local.
// Un .xlsx est une archive ZIP de fichiers XML ; on construit les deux à la main
// (ZIP « stored », sans compression).
// Colonnes du modèle AXA "exemple_virement_generique" :
//   Numéro de facture | Référence UNIQUE de paiement | Date du paiement | Montant versé TTC

const HEADERS     = ['Numéro de facture', 'Référence UNIQUE de paiement', 'Date du paiement', 'Montant versé TTC'];
const COL_LETTERS = ['A', 'B', 'C', 'D'];
const XLSX_MIME   = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

function xmlEscape(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// — ZIP « stored » (CRC32 + structure) ———————————————————————————————————————

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function concatBytes(arrays) {
  let total = 0;
  for (const a of arrays) total += a.length;
  const out = new Uint8Array(total);
  let pos = 0;
  for (const a of arrays) { out.set(a, pos); pos += a.length; }
  return out;
}

function buildZip(files) {
  const enc = new TextEncoder();
  const u16 = n => { const b = new Uint8Array(2); new DataView(b.buffer).setUint16(0, n & 0xFFFF, true); return b; };
  const u32 = n => { const b = new Uint8Array(4); new DataView(b.buffer).setUint32(0, n >>> 0, true); return b; };

  const local   = [];
  const central = [];
  let offset = 0;

  for (const f of files) {
    const nameBytes = enc.encode(f.name);
    const data      = enc.encode(f.content);
    const crc       = crc32(data);
    const size      = data.length;

    const lfh = concatBytes([
      u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(size), u32(size), u16(nameBytes.length), u16(0),
      nameBytes, data,
    ]);
    local.push(lfh);

    central.push(concatBytes([
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(size), u32(size), u16(nameBytes.length), u16(0), u16(0),
      u16(0), u16(0), u32(0), u32(offset), nameBytes,
    ]));

    offset += lfh.length;
  }

  const centralStart = offset;
  let centralSize = 0;
  for (const c of central) centralSize += c.length;

  const eocd = concatBytes([
    u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(centralSize), u32(centralStart), u16(0),
  ]);

  return concatBytes([...local, ...central, eocd]);
}

// — Classeur Excel ———————————————————————————————————————————————————————————

function sheetXML(invoices, paymentDate) {
  const rowsData = [HEADERS, ...invoices.map(inv => [
    inv.votreFact, inv.dossier, paymentDate, inv.montant,
  ])];

  const rows = rowsData.map((cells, r) => {
    const rowNum  = r + 1;
    const cellXML = cells.map((val, c) =>
      `<c r="${COL_LETTERS[c]}${rowNum}" t="inlineStr"><is><t xml:space="preserve">${xmlEscape(val)}</t></is></c>`
    ).join('');
    return `<row r="${rowNum}">${cellXML}</row>`;
  }).join('');

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
    `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">` +
    `<sheetData>${rows}</sheetData></worksheet>`;
}

function generateXLSX(invoices, paymentDate) {
  const files = [
    { name: '[Content_Types].xml', content:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">` +
      `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>` +
      `<Default Extension="xml" ContentType="application/xml"/>` +
      `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>` +
      `<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>` +
      `</Types>` },
    { name: '_rels/.rels', content:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
      `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>` +
      `</Relationships>` },
    { name: 'xl/workbook.xml', content:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">` +
      `<sheets><sheet name="Virement" sheetId="1" r:id="rId1"/></sheets></workbook>` },
    { name: 'xl/_rels/workbook.xml.rels', content:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
      `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>` +
      `</Relationships>` },
    { name: 'xl/worksheets/sheet1.xml', content: sheetXML(invoices, paymentDate) },
  ];
  return buildZip(files);
}

// ─────────────────────────────────────────────────────────────────────────────
// UI LOGIC
// ─────────────────────────────────────────────────────────────────────────────

const emailInput = document.getElementById('email-input');
const genBtn     = document.getElementById('gen-btn');
const preview    = document.getElementById('preview');
const status     = document.getElementById('status');

let parsedData = null;

emailInput.addEventListener('input', () => {
  const raw = emailInput.value.trim();
  status.className = '';
  status.style.display = 'none';

  if (!raw) {
    preview.classList.remove('show');
    genBtn.disabled = true;
    parsedData = null;
    return;
  }

  parsedData = parseAXAEmail(raw);

  if (parsedData.invoices.length === 0 || !parsedData.paymentRef) {
    preview.classList.remove('show');
    genBtn.disabled = true;
    return;
  }

  document.getElementById('f-ref').textContent   = parsedData.paymentRef  || '—';
  document.getElementById('f-date').textContent  = parsedData.paymentDate || '—';
  document.getElementById('f-total').textContent = parsedData.totalAmount  ? parsedData.totalAmount + ' €' : '—';
  document.getElementById('f-count').textContent = parsedData.invoices.length + ' facture(s)';

  // Répartition par site
  const groups = groupBySite(parsedData.invoices);
  const breakdown = document.getElementById('site-breakdown');
  breakdown.innerHTML = '';
  for (const [code, invs] of groups) {
    const chip = document.createElement('span');
    chip.className = 'site-chip' + (code === 'AUTRES' ? ' autres' : '');
    chip.innerHTML = `${SITE_LABELS[code]} <span class="count">${invs.length}</span>`;
    breakdown.appendChild(chip);
  }

  preview.classList.add('show');
  genBtn.disabled = false;
});

function downloadFile(bytes, filename, mime) {
  const blob = new Blob([bytes], { type: mime });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

genBtn.addEventListener('click', async () => {
  if (!parsedData) return;

  try {
    const groups   = groupBySite(parsedData.invoices);
    const dateStr  = parsedData.paymentDate.replace(/\//g, '-');
    const refStr   = parsedData.paymentRef || 'export';
    const fileList = [];

    let n = 0;
    for (const [code, invs] of groups) {
      const xlsx     = generateXLSX(invs, parsedData.paymentDate);
      const filename = `AXA_Virement_${SITE_LABELS[code]}_${refStr}_${dateStr}.xlsx`;
      // Petit délai entre chaque téléchargement pour éviter que le navigateur n'en bloque.
      if (n > 0) await new Promise(r => setTimeout(r, 350));
      downloadFile(xlsx, filename, XLSX_MIME);
      fileList.push(`${SITE_LABELS[code]} (${invs.length})`);
      n++;
    }

    status.className = 'show success';
    status.innerHTML = `
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd"/>
      </svg>
      <span>${fileList.length} fichier(s) Excel généré(s) — <strong>${fileList.join(' · ')}</strong></span>
    `;
  } catch (err) {
    status.className = 'show error';
    status.innerHTML = `
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-1.5 0v-4.5A.75.75 0 0 1 10 5Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd"/>
      </svg>
      <span>Erreur : ${err.message}</span>
    `;
  }
});
</script>
</body>
</html>
